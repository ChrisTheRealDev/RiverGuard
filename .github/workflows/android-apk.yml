name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies and check launcher
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx cap sync android
      - name: Install Android build tools
        uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check Android app
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --max-workers 2 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify installable APK and collect evidence
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/RiverGuard-Android-1.0.0-preview.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/*.apk | tee release/signature-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/*.apk | tee release/apk-details.txt
          grep -q "package: name='com.riverguard.app'" release/apk-details.txt
          grep -q "launchable-activity: name='com.riverguard.app.MainActivity'" release/apk-details.txt
          unzip -l release/*.apk | grep 'assets/public/index.html'
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          cp android/app/build/reports/lint-results-debug.html release/
      - uses: actions/upload-artifact@v4
        with:
          name: RiverGuard-Android-preview
          path: mobile/release/
          if-no-files-found: error
          retention-days: 14
