name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'frontend/vite.phone.config.ts', 'frontend/tsconfig.phone.json', '.github/workflows/android-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies and check launcher
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix ../frontend --no-audit --no-fund
          npm test
          npm run check:offline
          npm run build:offline
          npx cap sync android
      - name: Prepare persistent release signing
        env:
          SIGNING_KEY: ${{ secrets.RIVERGUARD_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/riverguard-release.p12"
      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install required SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check Android app
        env:
          RIVERGUARD_STORE_PASSWORD: ${{ secrets.RIVERGUARD_ANDROID_STORE_PASSWORD }}
        run: |
          export RIVERGUARD_KEYSTORE_FILE="$RUNNER_TEMP/riverguard-release.p12"
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --max-workers 2 :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Verify installable APK and collect evidence
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/RiverGuard-Android-Standalone-2.0.0-preview.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/*.apk | tee release/signature-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/*.apk | tee release/apk-details.txt
          grep -q "package: name='com.riverguard.app'" release/apk-details.txt
          grep -q "launchable-activity: name='com.riverguard.app.MainActivity'" release/apk-details.txt
          unzip -l release/*.apk | grep 'assets/public/index.html'
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          cp android/app/build/reports/lint-results-release.html release/
          cp android/app/build/test-results/testReleaseUnitTest/*.xml release/
      - uses: actions/upload-artifact@v4
        with:
          name: RiverGuard-Android-standalone-preview
          path: mobile/release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/riverguard-release.p12"
